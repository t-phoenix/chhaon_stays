# Render Blueprint — rootDir is relative to the REPOSITORY ROOT (not this file's folder).
# In Render dashboard: Blueprint Path = chhaon cafe ops/render.yaml (if not using repo-root copy).

services:
  - type: web
    name: chhaon-cafe-ops-api
    runtime: python
    plan: free
    rootDir: chhaon cafe ops/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: chhaon_cafe_ops
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://chhaon-cafe-ops.vercel.app,http://localhost:3000
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_NAME
        value: chhaon_access
      - key: ADMIN_MOBILE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Amrit
      - key: MESH_PIN
        sync: false
